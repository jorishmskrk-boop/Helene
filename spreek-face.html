<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hélène</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    background: #000000;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  /* Scout Ogen Styling (Precies hetzelfde als op het kampscherm in Hackerstand) */
  #scoutEyesContainer {
    position: absolute;
    top: 24vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 80px;
    align-items: center;
    justify-content: center;
    z-index: 10;
    animation: hackerGlitch 0.4s infinite ease-in-out alternate;
  }

  @keyframes hackerGlitch {
    0% { transform: translateX(-50%) translateY(0) scale(1.02); }
    25% { transform: translateX(-49%) translateY(-2px) scale(1.04); }
    50% { transform: translateX(-51%) translateY(2px) scale(0.99); }
    75% { transform: translateX(-50%) translateY(-1px) scale(1.03); }
    100% { transform: translateX(-50%) translateY(0) scale(1.02); }
  }

  .eye-wrapper {
    position: relative;
    width: clamp(100px, 15vw, 190px);
    height: clamp(120px, 18vw, 230px);
  }

  .scout-eye-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 38px #00ff66) drop-shadow(0 0 25px #00f0ff) !important;
    transform: scaleY(0.88) scaleX(1.1);
  }

  .scout-eye-svg .fleur-leaf { fill: #00ff66 !important; }
  .scout-eye-svg .fleur-ring, .scout-eye-svg .fleur-base { fill: #00f0ff !important; }

  .eyebrow-svg {
    position: absolute; top: -20%; left: 0; width: 100%; height: 35%;
    overflow: visible;
  }

  .left-eyebrow {
    transform: translateY(-8px) rotate(32deg) scale(1.3) !important;
    filter: drop-shadow(0 0 25px #00f0ff) !important;
    stroke: #00f0ff !important;
  }
  .right-eyebrow {
    transform: translateY(-8px) rotate(-32deg) scale(1.3) !important;
    filter: drop-shadow(0 0 25px #00f0ff) !important;
    stroke: #00f0ff !important;
  }

  /* Het gecentreerde Canvas voor de exacte mond-golfvorm */
  #canvasContainer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  #waveformCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #spreekUnlockPrompt {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(2, 132, 199, 0.95);
    color: #ffffff;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 50px;
    box-shadow: 0 0 30px rgba(2, 132, 199, 0.8), 0 0 10px #00ff66;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    animation: pulsePrompt 1.4s infinite ease-in-out alternate;
    text-align: center;
    white-space: nowrap;
  }
  @keyframes pulsePrompt {
    0% { transform: translateX(-50%) scale(1); }
    100% { transform: translateX(-50%) scale(1.06); }
  }
</style>
</head>
<body>

  <div id="spreekUnlockPrompt">🔊 Tik op het scherm om te beluisteren</div>

  <!-- Franse Lelie Ogen (Hackerstand) -->
  <div id="scoutEyesContainer" class="spooky">
    <div class="eye-wrapper left-eye spooky">
      <svg class="eyebrow-svg left-eyebrow" viewBox="0 0 100 30">
        <path d="M 10,24 Q 50,6 90,24" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" fill="none" />
      </svg>
      <svg class="scout-eye-svg" viewBox="0 0 100 120">
        <path class="fleur-leaf" d="M 50,8 C 64,32 70,55 50,90 C 30,55 36,32 50,8 Z" />
        <path class="fleur-leaf" d="M 44,64 C 18,48 4,58 8,76 C 13,90 36,80 44,70 Z" />
        <path class="fleur-leaf" d="M 56,64 C 82,48 96,58 92,76 C 87,90 64,80 56,70 Z" />
        <rect class="fleur-ring" x="30" y="70" width="40" height="9" rx="4.5" />
        <path class="fleur-base" d="M 38,81 C 44,95 50,110 50,110 C 50,110 56,95 62,81 Z" />
      </svg>
    </div>
    <div class="eye-wrapper right-eye spooky">
      <svg class="eyebrow-svg right-eyebrow" viewBox="0 0 100 30">
        <path d="M 10,24 Q 50,6 90,24" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" fill="none" />
      </svg>
      <svg class="scout-eye-svg" viewBox="0 0 100 120">
        <path class="fleur-leaf" d="M 50,8 C 64,32 70,55 50,90 C 30,55 36,32 50,8 Z" />
        <path class="fleur-leaf" d="M 44,64 C 18,48 4,58 8,76 C 13,90 36,80 44,70 Z" />
        <path class="fleur-leaf" d="M 56,64 C 82,48 96,58 92,76 C 87,90 64,80 56,70 Z" />
        <rect class="fleur-ring" x="30" y="70" width="40" height="9" rx="4.5" />
        <path class="fleur-base" d="M 38,81 C 44,95 50,110 50,110 C 50,110 56,95 62,81 Z" />
      </svg>
    </div>
  </div>

  <!-- Mond Canvas -->
  <div id="canvasContainer">
    <canvas id="waveformCanvas"></canvas>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const spreekText = window.SPREEK_TEXT || urlParams.get('tekst') || urlParams.get('text') || "Attentie voor deze mededeling.";

  const canvas = document.getElementById('waveformCanvas');
  const ctx = canvas.getContext('2d');
  const promptEl = document.getElementById('spreekUnlockPrompt');

  function hideUnlockPrompt() {
    if (promptEl) promptEl.style.opacity = '0';
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let audioCtx = null;
  let outputAnalyser = null;
  let freqData = new Uint8Array(64);
  let isPlaying = false;
  let smoothedVolume = 0;
  let wavePhase = 0;

  function renderMouth() {
    requestAnimationFrame(renderMouth);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let rawVolume = 0;
    if (isPlaying && outputAnalyser) {
      outputAnalyser.getByteFrequencyData(freqData);
      let sum = 0;
      for (let i = 0; i < 64; i++) sum += freqData[i];
      rawVolume = sum / (64 * 255);
    }
    smoothedVolume += (rawVolume - smoothedVolume) * 0.18;

    wavePhase += 0.08 + smoothedVolume * 0.25;

    const width = canvas.width;
    const height = canvas.height;
    const centerY = height * 0.58;

    ctx.lineWidth = 4 + smoothedVolume * 8;
    ctx.strokeStyle = "#00ff66";
    ctx.shadowBlur = 15 + smoothedVolume * 25;
    ctx.shadowColor = "#00ff66";

    const pointsCount = 120;
    const step = width / (pointsCount - 1);
    const points = [];

    for (let i = 0; i < pointsCount; i++) {
      const x = i * step;
      const normX = i / (pointsCount - 1);
      const envelope = Math.sin(normX * Math.PI);

      let y = centerY;
      if (smoothedVolume > 0.005) {
        const dynamicAmp = Math.min(smoothedVolume * (height * 0.16), height * 0.09);
        const wave1 = Math.sin(normX * Math.PI * 3 + wavePhase) * dynamicAmp;
        const wave2 = Math.sin(normX * Math.PI * 6 - wavePhase * 1.5) * (dynamicAmp * 0.3);
        y = centerY + (wave1 + wave2) * envelope;
      } else {
        const idleWave = Math.sin(normX * Math.PI * 2 + wavePhase) * 3;
        y = centerY + idleWave * envelope;
      }
      points.push({ x, y });
    }

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 0; i < points.length - 1; i++) {
      const xc = (points[i].x + points[i + 1].x) / 2;
      const yc = (points[i].y + points[i + 1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
    }
    ctx.stroke();
  }
  renderMouth();

  function parseTextWithPauses(text) {
    const segments = [];
    const regex = /\[\s*(?:stilte|pauze|pause)(?:\s*[:\s]\s*([\d\.]+\s*(?:ms|s|sec|seconde|seconden)?))?\s*\]|\(\s*(?:stilte|pauze|pause)(?:\s*[:\s]\s*([\d\.]+\s*(?:ms|s|sec|seconde|seconden)?))?\s*\)|<break\s+time=["']([\d\.]+\s*(?:ms|s|sec|seconde|seconden)?)["']\s*\/?>/gi;
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
      const preText = text.substring(lastIndex, match.index).trim();
      if (preText) segments.push({ type: "text", text: preText });

      const durationStr = (match[1] || match[2] || match[3] || "1s").toLowerCase().trim();
      let ms = 1000;
      if (durationStr.endsWith("ms")) ms = parseFloat(durationStr.replace("ms", "").trim());
      else if (durationStr.includes("sec") || durationStr.endsWith("s")) ms = parseFloat(durationStr.replace(/(?:seconden|seconde|sec|s)/g, "").trim()) * 1000;
      else ms = (parseFloat(durationStr) || 1) * 1000;

      segments.push({ type: "pause", durationMs: Math.max(100, Math.min(10000, isNaN(ms) ? 1000 : ms)) });
      lastIndex = regex.lastIndex;
    }

    const remaining = text.substring(lastIndex).trim();
    if (remaining) segments.push({ type: "text", text: remaining });
    if (segments.length === 0 && text.trim()) segments.push({ type: "text", text: text.trim() });
    return segments;
  }

  async function playSpreekAudio() {
    hideUnlockPrompt();
    if (isPlaying) return;
    isPlaying = true;

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (!outputAnalyser && audioCtx) {
        outputAnalyser = audioCtx.createAnalyser();
        outputAnalyser.fftSize = 512;
        outputAnalyser.smoothingTimeConstant = 0.8;
      }

      const segments = parseTextWithPauses(spreekText);

      for (const seg of segments) {
        if (seg.type === "text" && seg.text) {
          const res = await fetch('/api/tts/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: seg.text })
          });

          const data = await res.json();
          if (res.ok && data.audioBase64) {
            try {
              const bin = atob(data.audioBase64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

              const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);

              const src = audioCtx.createBufferSource();
              src.buffer = audioBuffer;
              src.playbackRate.value = 0.98;

              const subSrc = audioCtx.createBufferSource();
              subSrc.buffer = audioBuffer;
              subSrc.playbackRate.value = 0.88;

              const subGain = audioCtx.createGain();
              subGain.gain.value = 0.12;

              const biquad = audioCtx.createBiquadFilter();
              biquad.type = "lowshelf";
              biquad.frequency.value = 250;
              biquad.gain.value = 5;

              subSrc.connect(biquad);
              biquad.connect(subGain);

              const delay = audioCtx.createDelay();
              delay.delayTime.value = 0.12;

              const echoFeedback = audioCtx.createGain();
              echoFeedback.gain.value = 0.15;

              const echoGain = audioCtx.createGain();
              echoGain.gain.value = 0.12;

              delay.connect(echoFeedback);
              echoFeedback.connect(delay);
              delay.connect(echoGain);
              if (outputAnalyser) delay.connect(outputAnalyser);

              src.connect(delay);

              if (outputAnalyser) {
                src.connect(outputAnalyser);
                subGain.connect(outputAnalyser);
                outputAnalyser.connect(audioCtx.destination);
              } else {
                src.connect(audioCtx.destination);
              }

              await new Promise((resolve) => {
                src.onended = resolve;
                src.start(0);
                subSrc.start(0);
              });
            } catch (webAudioErr) {
              // HTML5 Fallback als WebAudio decode mislukt op mobiel
              console.warn("WebAudio mislukt, HTML5 Audio fallback gebruiken:", webAudioErr);
              const audioEl = new Audio("data:audio/mp3;base64," + data.audioBase64);
              await new Promise((resolve) => {
                audioEl.onended = resolve;
                audioEl.onerror = resolve;
                audioEl.play().catch(resolve);
              });
            }
          }
        } else if (seg.type === "pause" && seg.durationMs) {
          await new Promise((resolve) => setTimeout(resolve, seg.durationMs));
        }
      }
    } catch (e) {
      console.error('Fout bij afspelen spraak:', e);
    } finally {
      isPlaying = false;
    }
  }

  document.addEventListener('click', playSpreekAudio);
  document.addEventListener('touchstart', playSpreekAudio);

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(playSpreekAudio, 300);
  });
</script>
</body>
</html>
