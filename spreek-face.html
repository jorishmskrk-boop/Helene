<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SYSTEM OVERRIDE // Hélène Spraak</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    background: #000000; color: #00ff66;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 5vh 4vw 6vh 4vw;
    cursor: pointer;
    user-select: none;
    background-image: radial-gradient(rgba(0, 255, 102, 0.12) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .term-top {
    width: 100%; max-width: 850px;
    border-bottom: 1px dashed #00ff66;
    padding-bottom: 12px;
    font-size: 0.85rem;
    display: flex; justify-content: space-between; align-items: center;
  }

  .term-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.08em;
  }

  /* Cyber Fleur-de-Lis Ogen Styling */
  #scoutEyesContainer {
    position: relative;
    display: flex; gap: 6vw;
    align-items: center; justify-content: center;
    margin-top: 4vh;
    transition: transform 0.4s ease;
  }

  .eye-wrapper {
    position: relative;
    width: clamp(110px, 18vw, 220px);
    height: clamp(130px, 21vw, 260px);
  }

  .scout-eye-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 25px #00ff66) drop-shadow(0 0 45px rgba(0, 240, 255, 0.5));
    transition: filter 0.3s ease;
  }

  .scout-eye-svg .fleur-leaf {
    fill: #00ff66;
    transition: fill 0.3s ease;
  }
  .scout-eye-svg .fleur-ring, .scout-eye-svg .fleur-base {
    fill: #00f0ff;
    transition: fill 0.3s ease;
  }

  .eyebrow-svg {
    position: absolute; top: -20%; left: 0; width: 100%; height: 35%;
    overflow: visible; transition: transform 0.3s ease;
  }

  /* Cyber Ogen spreek gloed */
  #scoutEyesContainer.speaking .scout-eye-svg {
    filter: drop-shadow(0 0 45px #00ff66) drop-shadow(0 0 35px #00f0ff);
    animation: eyePulse 1.1s infinite ease-in-out alternate;
  }
  @keyframes eyePulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* Subtitels en Console Output onderaan */
  #bottomSection {
    width: 100%; max-width: 850px;
    background: #050b07;
    border: 1px solid #00ff66;
    border-radius: 8px;
    padding: 20px 24px;
    box-shadow: 0 0 30px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.05);
    text-align: left;
    display: flex; flex-direction: column; gap: 10px;
  }

  .sub-tag {
    font-size: 0.78rem;
    color: #00f0ff;
    letter-spacing: 0.08em;
    font-weight: 700;
  }

  #subtitles {
    font-size: clamp(1.3rem, 2.4vw, 2.4rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.35;
    text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    min-height: 2.8rem;
  }

  #tapHint {
    font-size: 0.8rem;
    color: #00ff66;
    opacity: 0.85;
    letter-spacing: 0.05em;
    margin-top: 4px;
    border-top: 1px dashed rgba(0, 255, 102, 0.3);
    padding-top: 8px;
  }
</style>
</head>
<body>

  <div class="term-top">
    <div class="term-title">> SYSTEM OVERRIDE // BROADCAST_STATION.EXE</div>
    <div>ENGINE: ELEVENLABS_SPOOKY_VOICE</div>
  </div>

  <!-- Cyber Fleur-de-Lis Ogen -->
  <div id="scoutEyesContainer">
    <div class="eye-wrapper left-eye">
      <svg class="eyebrow-svg left-eyebrow" viewBox="0 0 100 30">
        <path d="M 10,24 Q 50,6 90,24" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" fill="none" />
      </svg>
      <svg class="scout-eye-svg" viewBox="0 0 100 120">
        <path class="fleur-leaf" d="M 50,8 C 64,32 70,55 50,90 C 30,55 36,32 50,8 Z" />
        <path class="fleur-leaf" d="M 44,64 C 18,48 4,58 8,76 C 13,90 36,80 44,70 Z" />
        <path class="fleur-leaf" d="M 56,64 C 82,48 96,58 92,76 C 87,90 64,80 56,70 Z" />
        <rect class="fleur-ring" x="30" y="70" width="40" height="9" rx="4.5" />
        <path class="fleur-base" d="M 38,81 C 44,95 50,110 50,110 C 50,110 56,95 62,81 Z" />
      </svg>
    </div>
    <div class="eye-wrapper right-eye">
      <svg class="eyebrow-svg right-eyebrow" viewBox="0 0 100 30">
        <path d="M 10,24 Q 50,6 90,24" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" fill="none" />
      </svg>
      <svg class="scout-eye-svg" viewBox="0 0 100 120">
        <path class="fleur-leaf" d="M 50,8 C 64,32 70,55 50,90 C 30,55 36,32 50,8 Z" />
        <path class="fleur-leaf" d="M 44,64 C 18,48 4,58 8,76 C 13,90 36,80 44,70 Z" />
        <path class="fleur-leaf" d="M 56,64 C 82,48 96,58 92,76 C 87,90 64,80 56,70 Z" />
        <rect class="fleur-ring" x="30" y="70" width="40" height="9" rx="4.5" />
        <path class="fleur-base" d="M 38,81 C 44,95 50,110 50,110 C 50,110 56,95 62,81 Z" />
      </svg>
    </div>
  </div>

  <div id="bottomSection">
    <div class="sub-tag">> INKOMEND SPRAAKBERICHT:</div>
    <div id="subtitles">…</div>
    <div id="tapHint">> STATUS: TRANSMITTING AUDIO... [ 👆 TIK OP HET SCHERM OM OPNIEUW AF TE SPELEN ]</div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const spreekText = window.SPREEK_TEXT || urlParams.get('tekst') || urlParams.get('text') || "Attentie voor deze mededeling.";
  
  const subtitlesEl = document.getElementById('subtitles');
  const eyesContainer = document.getElementById('scoutEyesContainer');

  subtitlesEl.textContent = '"' + spreekText + '"';

  let audioCtx = null;
  let isPlaying = false;

  async function playSpreekAudio() {
    if (isPlaying) return;
    isPlaying = true;
    eyesContainer.classList.add('speaking');

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      const res = await fetch('/api/tts/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: spreekText })
      });

      const data = await res.json();
      if (res.ok && data.audioBase64) {
        const bin = atob(data.audioBase64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

        const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);

        src.onended = function () {
          eyesContainer.classList.remove('speaking');
          isPlaying = false;
        };

        src.start(0);
      } else {
        eyesContainer.classList.remove('speaking');
        isPlaying = false;
      }
    } catch (e) {
      console.error('Fout bij afspelen spraak:', e);
      eyesContainer.classList.remove('speaking');
      isPlaying = false;
    }
  }

  document.addEventListener('click', playSpreekAudio);

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(playSpreekAudio, 400);
  });
</script>
</body>
</html>
