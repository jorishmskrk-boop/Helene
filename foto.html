<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SYSTEM OVERRIDE // Foto Upload</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #00ff66;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image: radial-gradient(rgba(0, 255, 102, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .terminal {
    width: 100%;
    max-width: 440px;
    background: #050b07;
    border: 1px solid #00ff66;
    border-radius: 8px;
    padding: 24px 20px;
    box-shadow: 0 0 30px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.05);
  }

  .term-header {
    border-bottom: 1px dashed #00ff66;
    padding-bottom: 14px;
    margin-bottom: 20px;
    font-size: 0.82rem;
  }

  .term-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00ff66;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  input[type="text"] {
    width: 100%;
    background: #000;
    border: 1px solid #00ff66;
    border-radius: 4px;
    padding: 12px 14px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  input[type="text"]:focus {
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
  }

  .file-box {
    border: 1px dashed #00ff66;
    border-radius: 4px;
    padding: 20px 14px;
    text-align: center;
    background: #000;
    cursor: pointer;
    transition: background 0.2s;
  }

  .file-box:hover {
    background: rgba(0, 255, 102, 0.05);
  }

  .file-box p {
    font-size: 0.88rem;
    color: #fff;
    margin-bottom: 4px;
  }

  .file-box span {
    font-size: 0.75rem;
    color: #00ff66;
    opacity: 0.8;
  }

  #photoInput { display: none; }

  .preview-box {
    display: none;
    margin-top: 12px;
    border: 1px solid #00ff66;
    border-radius: 4px;
    overflow: hidden;
    max-height: 240px;
    background: #000;
  }

  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .btn {
    width: 100%;
    background: #00ff66;
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 14px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    transition: filter 0.15s, transform 0.1s;
  }

  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-log {
    margin-top: 18px;
    font-size: 0.8rem;
    line-height: 1.4;
    word-break: break-all;
    min-height: 1.4em;
  }
  .status-log.success { color: #00ff66; }
  .status-log.error { color: #ff3366; }
</style>
</head>
<body>

<div class="terminal">
  <div class="term-header">
    <div class="term-title">> SYSTEM OVERRIDE</div>
    <div>STATUS: PHOTO_UPLOADER.EXE // ACTIVE</div>
  </div>

  <form id="uploadForm">
    <div class="field">
      <label for="groupName">> GROEPSNAAM / TEAM:</label>
      <input type="text" id="groupName" placeholder="Typ groepsnaam..." required autocomplete="off" />
    </div>

    <div class="field">
      <label>> SELECTEER FOTOBESTAND:</label>
      <div class="file-box" onclick="document.getElementById('photoInput').click();">
        <p id="dropLabel">[ 📸 KLIK OM FOTO TE MAKEN / KIEZEN ]</p>
        <span>> Camera of bestand openen</span>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" />
      <div class="preview-box" id="previewBox">
        <img id="previewImg" src="" alt="Preview" />
      </div>
    </div>

    <button type="submit" class="btn" id="submitBtn">⚡ TRANSMIT FOTO</button>
  </form>

  <div class="status-log" id="statusLog">> WACHTEN OP INVOER...</div>
</div>

<script>
  const photoInput = document.getElementById('photoInput');
  const previewBox = document.getElementById('previewBox');
  const previewImg = document.getElementById('previewImg');
  const dropLabel = document.getElementById('dropLabel');
  const uploadForm = document.getElementById('uploadForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusLog = document.getElementById('statusLog');

  let selectedBase64 = null;

  photoInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1200;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        selectedBase64 = canvas.toDataURL('image/jpeg', 0.85);
        previewImg.src = selectedBase64;
        previewBox.style.display = 'block';
        dropLabel.textContent = '[ OK ] FOTO GELADEN (KLIK OM TE WIJZIGEN)';
        statusLog.textContent = '> READY FOR TRANSMISSION.';
        statusLog.className = 'status-log success';
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  uploadForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const groupName = document.getElementById('groupName').value.trim();

    if (!groupName || !selectedBase64) {
      statusLog.textContent = '> ERR: GROEPSNAAM EN FOTO VERPLICHT.';
      statusLog.className = 'status-log error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'TRANSMITTING...';
    statusLog.textContent = '> CONNECTING TO MAIN DISPLAY...';
    statusLog.className = 'status-log';

    try {
      const response = await fetch('/api/foto/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupName, imageData: selectedBase64 })
      });

      const data = await response.json();
      if (response.ok && data.status === 'ok') {
        statusLog.textContent = '> [ SUCCESS ] FOTO VERSTUURD! KIJK OP HET HOOFDSCHERM.';
        statusLog.className = 'status-log success';
        previewBox.style.display = 'none';
        selectedBase64 = null;
        dropLabel.textContent = '[ 📸 KLIK OM NOG EEN FOTO TE MAKEN ]';
        uploadForm.reset();
      } else {
        statusLog.textContent = '> ERR: ' + (data.message || 'UPLOAD MISLUKT.');
        statusLog.className = 'status-log error';
      }
    } catch (err) {
      statusLog.textContent = '> ERR: VERBINDINGSFOUT WITH SERVER.';
      statusLog.className = 'status-log error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '⚡ TRANSMIT FOTO';
    }
  });
</script>
</body>
</html>
