<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Foto Insturen | Hélène Scoutingkamp</title>
<style>
  :root {
    --ground: #0F172A;
    --surface: #1E293B;
    --surface-2: #334155;
    --border: #334155;
    --border-strong: #475569;
    --ink: #F8FAFC;
    --muted: #94A3B8;
    --accent: #38BDF8;
    --accent-deep: #0EA5E9;
    --accent-tint: #12283B;
    --good: #34D399;
    --crit: #F87171;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .container {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .crest {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    display: grid;
    place-items: center;
    margin: 0 auto 14px;
    color: #fff;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
  }

  .title {
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0 0 6px;
    color: #fff;
  }

  .sub {
    font-size: 0.88rem;
    color: var(--muted);
    margin: 0;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    background: var(--ground);
    border: 1.5px solid var(--border-strong);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--ink);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  .file-drop {
    border: 2px dashed var(--border-strong);
    border-radius: 18px;
    padding: 24px 16px;
    text-align: center;
    background: var(--ground);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .file-drop:hover, .file-drop.dragover {
    border-color: var(--accent);
    background: var(--accent-tint);
  }

  .file-drop svg {
    width: 42px;
    height: 42px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .file-drop p {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
  }

  .file-drop span {
    display: block;
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: 4px;
  }

  #photoInput {
    display: none;
  }

  .preview-box {
    display: none;
    margin-top: 14px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    max-height: 260px;
  }

  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .btn {
    width: 100%;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    transition: transform 0.15s, filter 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    filter: none;
  }

  .status-banner {
    display: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 0.92rem;
    font-weight: 600;
    text-align: center;
    margin-top: 18px;
    line-height: 1.4;
  }

  .status-banner.success {
    display: block;
    background: rgba(52, 211, 153, 0.15);
    border: 1px solid var(--good);
    color: var(--good);
  }

  .status-banner.error {
    display: block;
    background: rgba(248, 113, 113, 0.15);
    border: 1px solid var(--crit);
    color: var(--crit);
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="crest">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <h1 class="title">Foto Insturen</h1>
    <p class="sub">Stuur je foto in voor het Hélène kampscherm!</p>
  </div>

  <form id="uploadForm">
    <div class="field">
      <label for="groupName">Groepsnaam / Patrouille</label>
      <input type="text" id="groupName" placeholder="Bijv. De Verkenners - Groep 2" required autocomplete="off" />
    </div>

    <div class="field">
      <label>Kies of maak een foto</label>
      <div class="file-drop" id="fileDrop" onclick="document.getElementById('photoInput').click();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p id="dropLabel">📷 Tik hier om camera of foto te openen</p>
        <span>Max. bestand 10MB</span>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" />
      <div class="preview-box" id="previewBox">
        <img id="previewImg" src="" alt="Voorbeeld foto" />
      </div>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">🚀 Verstuur Foto</span>
    </button>
  </form>

  <div class="status-banner" id="statusBanner"></div>
</div>

<script>
  const photoInput = document.getElementById('photoInput');
  const previewBox = document.getElementById('previewBox');
  const previewImg = document.getElementById('previewImg');
  const dropLabel = document.getElementById('dropLabel');
  const uploadForm = document.getElementById('uploadForm');
  const submitBtn = document.getElementById('submitBtn');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const statusBanner = document.getElementById('statusBanner');

  let selectedBase64 = null;

  photoInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      showStatus('Selecteer a.u.b. een geldige afbeelding.', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = function (event) {
      const img = new Image();
      img.onload = function () {
        // Schaal de afbeelding dynamisch af naar max 1200px breedte/hoogte voor snelle transmissie
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1200;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        selectedBase64 = canvas.toDataURL('image/jpeg', 0.85);
        previewImg.src = selectedBase64;
        previewBox.style.display = 'block';
        dropLabel.textContent = '📸 Foto geselecteerd (tik om te wijzigen)';
        hideStatus();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  uploadForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const groupName = document.getElementById('groupName').value.trim();

    if (!groupName) {
      showStatus('Vul a.u.b. een groepsnaam in.', 'error');
      return;
    }
    if (!selectedBase64) {
      showStatus('Selecteer of maak eerst een foto!', 'error');
      return;
    }

    submitBtn.disabled = true;
    btnSpinner.style.display = 'inline-block';
    btnText.textContent = 'Versturen…';
    hideStatus();

    try {
      const response = await fetch('/api/foto/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          groupName: groupName,
          imageData: selectedBase64
        })
      });

      const data = await response.json();
      if (response.ok && data.status === 'ok') {
        showStatus('✅ Foto succesvol verzonden!\nKijk nu op het grote kampscherm voor de scan-analyse... 🔍', 'success');
        previewBox.style.display = 'none';
        selectedBase64 = null;
        dropLabel.textContent = '📷 Tik hier om nog een foto te maken';
        uploadForm.reset();
      } else {
        showStatus('❌ ' + (data.message || 'Fout bij het versturen van de foto.'), 'error');
      }
    } catch (err) {
      showStatus('❌ Verbindingsfout. Probeer het opnieuw.', 'error');
    } finally {
      submitBtn.disabled = false;
      btnSpinner.style.display = 'none';
      btnText.textContent = '🚀 Verstuur Foto';
    }
  });

  function showStatus(msg, type) {
    statusBanner.className = 'status-banner ' + type;
    statusBanner.innerText = msg;
  }

  function hideStatus() {
    statusBanner.className = 'status-banner';
    statusBanner.innerText = '';
  }
</script>
</body>
</html>
